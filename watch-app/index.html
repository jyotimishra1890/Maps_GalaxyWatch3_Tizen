<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>WatchNav</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Idle / map screen -->
<div id="screen-map" class="screen">
  <canvas id="map" width="360" height="360"></canvas>
  <div id="banner" class="banner hidden"></div>
  <div id="hud" class="hud hidden">
    <div id="hud-turn" class="hud-turn">Continue</div>
    <div id="hud-dist" class="hud-dist">0 m</div>
  </div>
  <div id="status" class="status">Starting…</div>
  <div id="btn-stop" class="btn btn-stop hidden">■</div>
  <div id="btn-menu" class="btn btn-menu">☰</div>
</div>

<!-- Menu -->
<div id="screen-menu" class="screen menu hidden">
  <div class="menu-title">WatchNav</div>
  <div class="menu-item" id="mi-navigate">Navigate</div>
  <div class="menu-item" id="mi-profile">Profile: <span id="mi-profile-val"></span></div>
  <div class="menu-item" id="mi-code">Pairing code: <span id="mi-code-val"></span></div>
  <div class="menu-item" id="mi-relay">Relay: <span id="mi-relay-val"></span></div>
  <div class="menu-item" id="mi-back">Back</div>
</div>

<!-- Pairing code entry -->
<div id="screen-code" class="screen hidden">
  <div class="pad-title">Pairing code</div>
  <div id="code-display" class="code-display">______</div>
  <div class="pad">
    <button class="pad-key" data-k="1">1</button><button class="pad-key" data-k="2">2</button><button class="pad-key" data-k="3">3</button>
    <button class="pad-key" data-k="4">4</button><button class="pad-key" data-k="5">5</button><button class="pad-key" data-k="6">6</button>
    <button class="pad-key" data-k="7">7</button><button class="pad-key" data-k="8">8</button><button class="pad-key" data-k="9">9</button>
    <button class="pad-key" data-k="del">⌫</button><button class="pad-key" data-k="0">0</button><button class="pad-key" data-k="ok">✓</button>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
